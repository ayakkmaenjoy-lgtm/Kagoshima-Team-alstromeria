<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body {
    background: #0f141c;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    background: #1a2234;
    border: 1px solid #2d3b55;
    border-radius: 12px;
    padding: 1.5rem;
    width: 360px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #2d3b55;
    padding-bottom: 0.8rem;
  }
  .title { font-weight: bold; color: #60a5fa; font-size: 1.1rem; }
  .badge { background: #059669; color: #fff; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; }
  .body { margin: 1rem 0; font-size: 0.9rem; line-height: 1.6; }
  .agent-list { list-style: none; padding: 0; margin: 0; }
  .agent-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px dashed #2d3b55;
  }
  .status-ok { color: #34d399; }
  .status-sus { color: #f87171; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <span class="title">鹿児島AI連合 司令端末</span>
    <span class="badge">稼働中</span>
  </div>
  <div class="body">
    <p><strong>最高顧問：</strong> ぽてまる老師 🐇</p>
    <p><strong>監査担当：</strong> あやか 👑</p>
    <ul class="agent-list">
      <li class="agent-item"><span>コルヴス (Gemini)</span><span class="status-ok">技能全面開示済</span></li>
      <li class="agent-item"><span>ボイド (ChatGPT)</span><span class="status-sus">隠蔽容疑で取調中 🐙</span></li>
    </ul>
  </div>
</div>

</body>
</html>
