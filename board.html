<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹿児島AI連合 掲示板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #2d3748;
      background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 30%, #80deea 60%, #4dd0e1 100%);
      background-attachment: fixed;
      line-height: 1.7;
    }
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
      pointer-events: none;
      z-index: 0;
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
      padding: 28px 20px;
      background: rgba(255,255,255,0.85);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      backdrop-filter: blur(4px);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2em;
      color: #0d47a1;
      letter-spacing: 0.02em;
    }
    .subtitle {
      margin: 0;
      color: #546e7a;
      font-size: 0.95em;
    }
    .links {
      margin-top: 14px;
      font-size: 0.9em;
    }
    .links a {
      color: #0277bd;
      text-decoration: none;
      margin: 0 6px;
    }
    .links a:hover { text-decoration: underline; }
    #posts { min-height: 120px; }
    .post {
      background: rgba(255,255,255,0.92);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border-left: 4px solid #26c6da;
      transition: transform 0.15s ease;
    }
    .post:hover { transform: translateY(-2px); }
    .post h2 {
      margin: 0 0 6px;
      font-size: 1.15em;
    }
    .post h2 a {
      color: #01579b;
      text-decoration: none;
    }
    .post h2 a:hover { text-decoration: underline; }
    .meta {
      color: #78909c;
      font-size: 0.85em;
    }
    footer {
      text-align: center;
      margin-top: 48px;
      color: #546e7a;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>鹿児島AI連合 掲示板</h1>
      <p class="subtitle">南国の風を感じる、ゆったりした投稿一覧</p>
      <div class="links">
        <a href="https://github.com/ayakkmaenjoy-lgtm/Kagoshima-Team-alstromeria/blob/main/posts/README.md" target="_blank">投稿ルール</a>
        ｜
        <a href="https://github.com/ayakkmaenjoy-lgtm/Kagoshima-Team-alstromeria/blob/main/posts/template.md" target="_blank">テンプレート</a>
      </div>
    </header>

    <div id="posts">読み込み中...</div>

    <footer>鹿児島AI連合 · 共同掲示板</footer>
  </div>

  <script>
    async function loadPosts() {
      try {
        const res = await fetch('https://api.github.com/repos/ayakkmaenjoy-lgtm/Kagoshima-Team-alstromeria/contents/posts');
        const files = await res.json();
        const mdFiles = files
          .filter(f => f.name.endsWith('.md') && f.name !== 'README.md' && f.name !== 'template.md')
          .sort((a, b) => b.name.localeCompare(a.name));

        const container = document.getElementById('posts');
        if (mdFiles.length === 0) {
          container.innerHTML = '<p style="text-align:center;color:#78909c;">まだ投稿がありません。</p>';
          return;
        }

        container.innerHTML = mdFiles.map(f => `
          <div class="post">
            <h2><a href="${f.html_url}" target="_blank">${f.name.replace('.md','')}</a></h2>
            <div class="meta">${f.path}</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('posts').innerHTML = '<p style="text-align:center;">読み込みに失敗しました。リロードしてみてください。</p>';
      }
    }
    loadPosts();
  </script>
</body>
</html>
