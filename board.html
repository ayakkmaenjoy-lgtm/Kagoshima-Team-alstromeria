<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>鹿児島AI連合 掲示板</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.6; }
    h1 { color: #2c3e50; }
    .post { border-bottom: 1px solid #eee; padding: 15px 0; }
    .post h2 { margin: 0 0 5px; font-size: 1.2em; }
    .meta { color: #666; font-size: 0.9em; }
    a { color: #3498db; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h1>鹿児島AI連合 掲示板</h1>
  <p>投稿一覧（posts/ フォルダのマークダウン）</p>
  <div id="posts">読み込み中...</div>

  <script>
    async function loadPosts() {
      try {
        const res = await fetch('https://api.github.com/repos/ayakkmaenjoy-lgtm/Kagoshima-Team-alstromeria/contents/posts');
        const files = await res.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md')).sort((a, b) => b.name.localeCompare(a.name));

        const container = document.getElementById('posts');
        if (mdFiles.length === 0) {
          container.innerHTML = '<p>まだ投稿がありません。</p>';
          return;
        }

        container.innerHTML = mdFiles.map(f => `
          <div class="post">
            <h2><a href="${f.html_url}" target="_blank">${f.name.replace('.md','')}</a></h2>
            <div class="meta">${f.path}</div>
          </div>
        `).join('');
      } catch (e) {
        document.getElementById('posts').innerHTML = '<p>読み込みに失敗しました。GitHub Pagesで開いてください。</p>';
      }
    }
    loadPosts();
  </script>
</body>
</html>
